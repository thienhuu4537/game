<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Xỉu Tài</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .difficulty-screen, .game-screen {
            display: none;
        }

        .difficulty-screen.active, .game-screen.active {
            display: block;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin: 10px 5px;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .btn:active {
            transform: translateY(0);
        }

        .difficulty-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .info-box {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin: 20px 0;
            border-radius: 5px;
        }

        .money-display {
            font-size: 1.3em;
            font-weight: bold;
            color: #28a745;
            text-align: center;
            margin: 20px 0;
        }

        .target-display {
            font-size: 1.1em;
            color: #ff6b6b;
            text-align: center;
            margin-bottom: 20px;
        }

        .dice-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }

        .dice {
            width: 80px;
            height: 80px;
            background: white;
            border: 3px solid #667eea;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .bet-controls {
            margin: 20px 0;
        }

        .bet-controls label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            color: #333;
        }

        .bet-controls input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .bet-controls input:focus {
            outline: none;
            border-color: #667eea;
        }

        .choice-buttons {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }

        .xiu-btn {
            background: linear-gradient(135deg, #56ccf2 0%, #2f80ed 100%);
        }

        .tai-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .result {
            text-align: center;
            font-size: 1.5em;
            font-weight: bold;
            margin: 20px 0;
            padding: 15px;
            border-radius: 10px;
        }

        .result.win {
            background: #d4edda;
            color: #155724;
        }

        .result.lose {
            background: #f8d7da;
            color: #721c24;
        }

        .result-sum {
            font-size: 1.3em;
            text-align: center;
            margin: 15px 0;
            color: #667eea;
            font-weight: bold;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎲 GAME XỈU TÀI 🎲</h1>
        
        <!-- Màn hình chọn độ khó -->
        <div class="difficulty-screen active">
            <h2 style="text-align: center; margin-bottom: 20px;">Chọn độ khó:</h2>
            <button class="btn difficulty-btn" onclick="startGame(1)">
                1. Dễ<br>
                <small>1.000.000 VNĐ → 5.000.000 VNĐ</small>
            </button>
            <button class="btn difficulty-btn" onclick="startGame(2)">
                2. Trung bình<br>
                <small>1.000.000 VNĐ → 10.000.000 VNĐ</small>
            </button>
            <button class="btn difficulty-btn" onclick="startGame(3)">
                3. Khó<br>
                <small>500.000 VNĐ → 10.000.000 VNĐ</small>
            </button>
            <button class="btn difficulty-btn" onclick="startGame(4)">
                4. Châu Á<br>
                <small>100.000 VNĐ → 100.000.000 VNĐ</small>
            </button>
        </div>

        <!-- Màn hình chơi game -->
        <div class="game-screen">
            <div class="info-box">
                <div id="difficultyInfo"></div>
            </div>
            
            <div class="money-display">
                Số dư: <span id="currentMoney">0</span> VNĐ
            </div>
            <div class="target-display">
                Mục tiêu: <span id="targetMoney">0</span> VNĐ
            </div>

            <div class="dice-container">
                <div class="dice" id="dice1">?</div>
                <div class="dice" id="dice2">?</div>
                <div class="dice" id="dice3">?</div>
            </div>

            <div id="resultSum" class="result-sum hidden"></div>
            <div id="resultMessage" class="result hidden"></div>

            <div class="bet-controls">
                <label for="betAmount">Tiền cược (tối thiểu 1.000 VNĐ):</label>
                <input type="number" id="betAmount" min="1000" step="1000" placeholder="Nhập số tiền">
            </div>

            <div class="choice-buttons">
                <button class="btn xiu-btn" onclick="placeBet(1)">XỈU (3-10)</button>
                <button class="btn tai-btn" onclick="placeBet(2)">TÀI (11-18)</button>
            </div>

            <button class="btn" onclick="resetGame()" style="background: #6c757d; margin-top: 20px;">
                Chơi lại
            </button>
        </div>
    </div>

    <script>
        let myMoney = 0;
        let targetMoney = 0;
        let difficulty = 1;
        let gameEnded = false;

        function getRandom(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function formatMoney(amount) {
            return amount.toLocaleString('vi-VN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }

        function startGame(level) {
            difficulty = level;
            gameEnded = false;
            
            const difficultyNames = ['', 'Dễ', 'Trung bình', 'Khó', 'Châu Á'];
            
            if (level === 1) {
                myMoney = 1000000;
                targetMoney = 5000000;
            } else if (level === 2) {
                myMoney = 1000000;
                targetMoney = 10000000;
            } else if (level === 3) {
                myMoney = 500000;
                targetMoney = 10000000;
            } else if (level === 4) {
                myMoney = 100000;
                targetMoney = 100000000;
            }

            document.querySelector('.difficulty-screen').classList.remove('active');
            document.querySelector('.game-screen').classList.add('active');
            
            document.getElementById('difficultyInfo').innerHTML = `<strong>Độ khó: ${difficultyNames[level]}</strong>`;
            document.getElementById('currentMoney').textContent = formatMoney(myMoney);
            document.getElementById('targetMoney').textContent = formatMoney(targetMoney);
            document.getElementById('betAmount').value = '';
            document.getElementById('dice1').textContent = '?';
            document.getElementById('dice2').textContent = '?';
            document.getElementById('dice3').textContent = '?';
            document.getElementById('resultSum').classList.add('hidden');
            document.getElementById('resultMessage').classList.add('hidden');
        }

        function placeBet(choice) {
            if (gameEnded) return;

            const betAmount = parseFloat(document.getElementById('betAmount').value);
            
            if (isNaN(betAmount) || betAmount < 1000) {
                alert('Vui lòng nhập tiền cược tối thiểu 1.000 VNĐ');
                return;
            }

            if (betAmount >= myMoney) {
                alert('Số tiền cược phải nhỏ hơn số dư hiện tại!');
                return;
            }

            // Tung xúc xắc
            const dice1 = getRandom(1, 6);
            const dice2 = getRandom(1, 6);
            const dice3 = getRandom(1, 6);
            const sum = dice1 + dice2 + dice3;

            document.getElementById('dice1').textContent = dice1;
            document.getElementById('dice2').textContent = dice2;
            document.getElementById('dice3').textContent = dice3;

            myMoney -= betAmount;

            let resultText = '';
            let isWin = false;

            if (sum <= 10) {
                resultText = `${sum} → XỈU`;
                if (choice === 1) {
                    myMoney += betAmount * 1.98;
                    isWin = true;
                }
            } else {
                resultText = `${sum} → TÀI`;
                if (choice === 2) {
                    myMoney += betAmount * 1.98;
                    isWin = true;
                }
            }

            document.getElementById('resultSum').textContent = resultText;
            document.getElementById('resultSum').classList.remove('hidden');

            const resultMessage = document.getElementById('resultMessage');
            resultMessage.classList.remove('hidden', 'win', 'lose');
            
            if (isWin) {
                resultMessage.textContent = '🎉 BẠN THẮNG! 🎉';
                resultMessage.classList.add('win');
            } else {
                resultMessage.textContent = '😢 BẠN THUA! 😢';
                resultMessage.classList.add('lose');
            }

            document.getElementById('currentMoney').textContent = formatMoney(myMoney);

            // Kiểm tra điều kiện kết thúc
            if (myMoney >= targetMoney) {
                setTimeout(() => {
                    alert('🎊 CHÚC MỪNG! BẠN ĐÃ HOÀN THÀNH MỤC TIÊU! 🎊');
                    gameEnded = true;
                }, 500);
            } else if (myMoney <= 0) {
                setTimeout(() => {
                    alert('😔 BẠN ĐÃ THUA! HẾT TIỀN! 😔');
                    gameEnded = true;
                }, 500);
            }

            document.getElementById('betAmount').value = '';
        }

        function resetGame() {
            document.querySelector('.game-screen').classList.remove('active');
            document.querySelector('.difficulty-screen').classList.add('active');
        }
    </script>
</body>
</html>
